apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  namespace: product-api
spec:
  # One replica is enough for local learning; increase this for scaling in real environments.
  replicas: 1
  selector:
    matchLabels:
      app: product-api
  template:
    metadata:
      labels:
        app: product-api
    spec:
      containers:
        - name: product-api
          # Replace with your registry image name when deploying to a real cluster.
          image: muskan1077gupta/product-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            # App settings and secrets are injected as environment variables here.
            - configMapRef:
                name: product-api-config
            - secretRef:
                name: product-api-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
