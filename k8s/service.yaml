apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: product-api
spec:
  # ClusterIP exposes the app inside the cluster; kubectl port-forward makes it reachable locally.
  selector:
    app: product-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
